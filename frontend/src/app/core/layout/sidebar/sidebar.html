<aside class="h-full bg-[#321847] text-white shadow-[8px_0_30px_-24px_rgba(15,23,42,0.75)]" aria-label="Main navigation">
  <div class="flex h-full min-w-0 flex-col px-3 py-5 lg:py-7">
    <a routerLink="/dashboard" class="flex items-center gap-3 rounded-lg focus-visible:outline focus-visible:outline-4 focus-visible:outline-offset-4 focus-visible:outline-[#f15153]" [class.justify-center]="collapsed()" aria-label="ServicePilot dashboard">
      <span class="grid size-11 shrink-0 place-items-center rounded-xl bg-[#f15153] text-white shadow-[0_10px_20px_-14px_rgba(241,81,83,0.95)]" aria-hidden="true">
        <svg class="size-6" viewBox="0 0 24 24" fill="none">
          <path d="M14.7 6.3a4.6 4.6 0 0 0-5.8 5.8L4.5 16.5a2.1 2.1 0 1 0 3 3l4.4-4.4a4.6 4.6 0 0 0 5.8-5.8l-3 3-2.7-2.7 2.7-3.3Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      @if (!collapsed()) {
        <span class="min-w-0">
          <span class="block truncate text-lg font-extrabold leading-tight tracking-tight">ServicePilot</span>
          <span class="mt-0.5 block truncate text-xs font-medium text-violet-200">Staff workspace</span>
        </span>
      }
    </a>

    <nav class="mt-5 flex gap-2 overflow-x-auto pb-2 lg:mt-8 lg:grid lg:overflow-visible lg:pb-0" aria-label="Staff navigation">
      <a routerLink="/dashboard" class="flex shrink-0 items-center gap-3 rounded-xl bg-[#f15153] px-3.5 py-3 text-sm font-extrabold text-white shadow-[0_10px_18px_-14px_rgba(241,81,83,0.9)] focus-visible:outline focus-visible:outline-4 focus-visible:outline-offset-2 focus-visible:outline-white lg:w-full" [class.justify-center]="collapsed()" aria-current="page" aria-label="Dashboard">
        <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 13h7V4H4v9Zm0 7h7v-4H4v4Zm10 0h6v-9h-6v9Zm0-12h6V4h-6v4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        </svg>
        @if (!collapsed()) {
          <span>Dashboard</span>
        }
      </a>

      <button type="button" disabled class="flex shrink-0 cursor-default items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-bold text-violet-100 lg:w-full" [class.justify-center]="collapsed()" aria-label="Customers">
        <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20m6-8a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm9 8v-1.5a3.5 3.5 0 0 0-2.5-3.35M15 4.15a4 4 0 0 1 0 7.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        @if (!collapsed()) { <span>Customers</span> }
      </button>

      <button type="button" disabled class="flex shrink-0 cursor-default items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-bold text-violet-100 lg:w-full" [class.justify-center]="collapsed()" aria-label="Vehicles">
        <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m5 16 1.5-5h11l1.5 5M4 16h16v3H4v-3Zm3 3v1m10-1v1M8 8l1-3h6l1 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        @if (!collapsed()) { <span>Vehicles</span> }
      </button>

      <button type="button" disabled class="flex shrink-0 cursor-default items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-bold text-violet-100 lg:w-full" [class.justify-center]="collapsed()" aria-label="Appointments">
        <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 3v3m10-3v3M4.5 9h15M6 5h12a2 2 0 0 1 2 2v12H4V7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        @if (!collapsed()) { <span>Appointments</span> }
      </button>

      <button type="button" disabled class="flex shrink-0 cursor-default items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-bold text-violet-100 lg:w-full" [class.justify-center]="collapsed()" aria-label="Work Orders">
        <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M8 4h8m-7 0v3h6V4m-9 1h12a2 2 0 0 1 2 2v13H4V7a2 2 0 0 1 2-2Zm2 7h8m-8 4h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        @if (!collapsed()) { <span>Work Orders</span> }
      </button>

      <button type="button" disabled class="flex shrink-0 cursor-default items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-bold text-violet-100 lg:w-full" [class.justify-center]="collapsed()" aria-label="Inventory">
        <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m4 7 8-4 8 4-8 4-8-4Zm0 0v10l8 4m8-14v10l-8 4m0-10v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        @if (!collapsed()) { <span>Inventory</span> }
      </button>

      <button type="button" disabled class="flex shrink-0 cursor-default items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-bold text-violet-100 lg:w-full" [class.justify-center]="collapsed()" aria-label="Mechanics">
        <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M14.7 6.3a4.6 4.6 0 0 0-5.8 5.8L4.5 16.5a2.1 2.1 0 1 0 3 3l4.4-4.4a4.6 4.6 0 0 0 5.8-5.8l-3 3-2.7-2.7 2.7-3.3Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        @if (!collapsed()) { <span>Mechanics</span> }
      </button>

      <button type="button" disabled class="flex shrink-0 cursor-default items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-bold text-violet-100 lg:w-full" [class.justify-center]="collapsed()" aria-label="Admin Users">
        <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3 5 6v5c0 4.6 2.9 7.9 7 10 4.1-2.1 7-5.4 7-10V6l-7-3Zm0 5v4m0 3.5v.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        @if (!collapsed()) { <span>Admin Users</span> }
      </button>

      <button type="button" disabled class="flex shrink-0 cursor-default items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-bold text-violet-100 lg:w-full" [class.justify-center]="collapsed()" aria-label="Settings">
        <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm7-3.5 2-1-2-3-2.2.5a7.6 7.6 0 0 0-1.3-.8L15 4h-6l-.5 2.7c-.5.2-.9.5-1.3.8L5 7l-2 3 2 1a7.8 7.8 0 0 0 0 2l-2 1 2 3 2.2-.5c.4.3.8.6 1.3.8L9 20h6l.5-2.7c.5-.2.9-.5 1.3-.8l2.2.5 2-3-2-1a7.8 7.8 0 0 0 0-2Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        @if (!collapsed()) { <span>Settings</span> }
      </button>
    </nav>

    @if (!collapsed()) {
      <div class="mt-auto hidden rounded-xl border border-white/10 bg-white/5 p-4 lg:block">
        <p class="text-xs font-bold uppercase tracking-wider text-violet-200">Workspace</p>
        <p class="mt-1 text-sm font-extrabold text-white">Service operations</p>
        <p class="mt-1 text-xs leading-relaxed text-violet-200">Staff administration portal</p>
      </div>
    }
  </div>
</aside>
