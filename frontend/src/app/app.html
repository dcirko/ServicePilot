@if (isAuthPage()) {
  <router-outlet></router-outlet>
} @else {
  <div class="min-h-screen bg-slate-50 font-sans text-slate-900 transition-[grid-template-columns] duration-300 ease-in-out lg:grid" [style.grid-template-columns]="sidebarCollapsed() ? '4.5rem minmax(0, 1fr)' : '16rem minmax(0, 1fr)'">
    <app-sidebar class="block lg:sticky lg:top-0 lg:h-screen" [collapsed]="sidebarCollapsed()"></app-sidebar>

    <div class="flex min-h-screen min-w-0 flex-col">
      <app-topbar class="sticky top-0 z-20 block" [sidebarCollapsed]="sidebarCollapsed()" (sidebarToggle)="toggleSidebar()"></app-topbar>

      <main class="min-w-0 flex-1 bg-slate-50 px-4 py-8 text-slate-900 sm:px-6 lg:px-8">
        <router-outlet></router-outlet>
      </main>

      <app-footer class="block"></app-footer>
    </div>
  </div>
}
