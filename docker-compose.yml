services:
  db:
    image: postgres:16
    container_name: servicepilot-db
    environment:
      POSTGRES_DB: servicepilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - servicepilot_postgres_data:/var/lib/postgresql/data

volumes:
  servicepilot_postgres_data: