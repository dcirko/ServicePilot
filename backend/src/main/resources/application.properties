spring.application.name=backend
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/servicepilot
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-expiration-minutes=10
app.security.jwt.refresh-token-expiration-days=30
app.security.cookie.access-token-name=SP_ACCESS_TOKEN
app.security.cookie.refresh-token-name=SP_REFRESH_TOKEN
app.security.cookie.secure=false
app.security.cookie.same-site=Lax
app.security.cookie.domain=
app.security.cookie.path=/
app.cors.allowed-origin=http://localhost:4200

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
